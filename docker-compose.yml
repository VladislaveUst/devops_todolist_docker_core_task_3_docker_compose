#version: "2.38.1"

services:
  mysql_db:
    container_name: my-sql
    image: mysql-local:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - db-data-net

  todoapp:
    image: todoapp:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: Development
    ports:
      - "8080:8080"
    networks:
      - db-data-net
    depends_on:
      - mysql_db
    restart: unless-stopped

volumes:
  db-data:

networks:
  db-data-net:
    driver: bridge